function fN(v){
  if(v===null||v===undefined||v===""||v==="-")return"—";
  const n=parseInt(String(v).replace(/,/g,""))||0;
  if(!n)return"—";
  return Math.abs(n)>=10000?(n/10000).toFixed(1)+"萬":n.toLocaleString();
}
function fD(v){
  const n=parseInt(String(v||"").replace(/[,+]/g,""))||0;
  if(n>0)return{s:"+"+n.toLocaleString(),c:"#22C55E"};
  if(n<0)return{s:n.toLocaleString(),c:"#EF4444"};
  return null;
}
function fDate(raw){
  if(!raw)return"";
  const d=new Date(raw);
  return isNaN(d)?String(raw).slice(0,7):`${d.getFullYear()}/${d.getMonth()+1}`;
}
function buildAgg(rows){
  const a={},tm=["行銷靈感庫","媒體新聞牆","Spotify 本月熱門 Top 3","Spotify 指標歌單紀錄"];
  rows.forEach(r=>Object.entries(r).forEach(([k,v])=>{
    if(v===null||v===undefined||String(v).trim()===""||v==="-")return;
    tm.includes(k)?a[k]=String(v):a[k]=v;
  }));
  return a;
}
function buildHist(rows){
  const seen={},h=[];
  rows.forEach(r=>{
    const dk=Object.values(r)[0];
    if(!dk||seen[dk])return;
    seen[dk]=true;
    h.push({date:fDate(dk),ig:parseInt(String(r["IG 粉絲數"]||0).replace(/,/g,""))||0,sp:parseInt(String(r["Spotify 月聽眾量"]||0).replace(/,/g,""))||0,ytS:parseInt(String(r["YouTube 訂閱數"]||0).replace(/,/g,""))||0,ytT:parseInt(String(r["YouTube 總觀看量"]||0).replace(/,/g,""))||0});
  });
  return h.reverse();
}
function parsePress(raw){
  if(!raw)return[];
  return String(raw).split(/\n/).map(line=>{
    const um=line.match(/\((https?:\/\/[^)]+)\)/);
    const title=line.replace(/^\d+\.\s*/,"").replace(/\s*\(https?:\/\/[^)]+\)/,"").replace(/\s*中的YouTube影片/,"").replace(/\s*-\s*[^-（(]+$/,"").trim();
    const sm=line.match(/-\s*([^(-]+?)(?:\s*\(|$)/);
    return{title,source:sm?sm[1].trim():"",url:um?um[1]:""};
  }).filter(p=>p.title);
}
function parseList(raw){
  if(!raw)return[];
  return String(raw).split(/[\n；;]+/).map(s=>s.trim()).filter(Boolean);
}

function miniChart(data,field,color){
  const vals=data.map(d=>d[field]);
  if(!vals.some(v=>v>0)||data.length<2)return`<div style="color:#525252;font-size:12px;text-align:center;padding:14px 0">${t("noHist")}</div>`;
  const W=500,H=110,PL=50,PR=8,PT=6,PB=28,cW=W-PL-PR,cH=H-PT-PB;
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const xStep=cW/(data.length-1);
  const pts=data.map((d,i)=>({x:PL+i*xStep,y:PT+cH-(d[field]-min)/range*cH,v:d[field],date:d.date}));
  const poly=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const area=`${PL},${PT+cH} ${poly} ${PL+cW},${PT+cH}`;
  const yT=[min,min+range/2,max].map(v=>Math.abs(v)>=10000?(v/10000).toFixed(1)+"萬":Math.round(v).toLocaleString());
  const yY=[PT+cH,PT+cH/2,PT];
  return`<div style="overflow:hidden"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
    <defs><linearGradient id="g${field}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".15"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0,1,2].map(i=>`<line x1="${PL}" y1="${yY[i]}" x2="${PL+cW}" y2="${yY[i]}" stroke="#1F1F1F" stroke-width="1"/>`).join("")}
    ${yT.map((tk,i)=>`<text x="${PL-4}" y="${yY[i]+4}" text-anchor="end" font-size="10" fill="#525252">${tk}</text>`).join("")}
    ${data.map((d,i)=>`<text x="${PL+i*xStep}" y="${H-4}" text-anchor="middle" font-size="9" fill="#525252">${d.date}</text>`).join("")}
    <polygon points="${area}" fill="url(#g${field})"/>
    <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}" stroke="#171717" stroke-width="1.5"/>`).join("")}
  </svg></div>`;
}

    <div style="position:relative;width:100%;height:420px;border-radius:12px;overflow:hidden;margin-bottom:20px">
      <img src="${IMGS.cover}" style="width:100%;height:100%;object-fit:cover;object-position:center center" onerror="this.style.display='none'"/>
      <div style="position:absolute;inset:0;background:linear-gradient(to top,#111 0%,transparent 60%)"></div>
      <div style="position:absolute;bottom:16px;left:16px">
        <div style="font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px">Endless</div>
        <div style="font-size:12px;color:#A3A3A3">${BAND.genre}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
      <div>
        <div style="font-size:13px;color:#9D7AFF;font-style:italic;margin-bottom:12px;line-height:1.6">"${BAND.slogan}"</div>
        <p style="font-size:13px;color:#A3A3A3;line-height:1.75;margin-bottom:14px">${BAND.desc}</p>
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
          <div style="font-size:12px;color:#737373">🗓 成團日：<span style="color:#E5E5E5">${BAND.founded}</span></div>
          <div style="font-size:12px;color:#737373">🎸 風格：<span style="color:#E5E5E5">${BAND.genre}</span></div>
          <div style="font-size:12px;color:#737373">✉️ 聯繫：<a href="mailto:${BAND.email}" style="color:#7C3AED">${BAND.email}</a></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <a href="${BAND.ig}" target="_blank" class="tag" style="color:#E1306C;background:#E1306C18;border:1px solid #E1306C33">@endless.band_official ↗</a>
          <a href="${BAND.yt}" target="_blank" class="tag" style="color:#FF4444;background:#FF444418;border:1px solid #FF444433">YouTube ↗</a>
          <a href="${BAND.sp}" target="_blank" class="tag" style="color:#1DB954;background:#1DB95418;border:1px solid #1DB95433">Spotify ↗</a>
        </div>
      </div>
      <div>
        <div style="font-size:12px;color:#737373;font-weight:600;margin-bottom:10px;letter-spacing:.5px">🏆 比賽經歷</div>
        ${BAND.contests.map(c=>`<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px"><span style="color:#F59E0B;flex-shrink:0">▸</span><span style="font-size:13px;color:#E5E5E5;line-height:1.5">${c}</span></div>`).join("")}
        <div style="margin-top:14px;padding:12px;background:#1a1a1a;border-radius:10px;border:1px solid #262626">
          <div style="font-size:11px;color:#737373;margin-bottom:6px">📊 IG 成長里程碑</div>
          ${["2024.06 突破千人","2024.08 突破 2 千","2024.10 突破 3 千","2024.12 突破 4 千","2025.03 突破 5 千","2025.07 突破 6 千","2025 下半年 突破 1 萬"].map(m=>`<div style="font-size:12px;color:#A3A3A3;padding:3px 0">・${m}</div>`).join("")}
        </div>
      </div>
    </div>`;

  } else if(aboutTab==="members"){
    content=`<div class="member-grid">${BAND.members.map(m=>`
      <div class="mcard">
        <div class="img-box" style="height:220px">
          <img src="${IMGS.members[m.name]}" style="object-position:${MEMBER_POS[m.name]||'center center'}" onerror="this.parentElement.style.display='none'"/>
        </div>
        <div style="font-size:16px;font-weight:800;color:#fff">${m.name}</div>
        <div style="font-size:11px;color:#7C3AED;margin-top:1px;margin-bottom:2px">${m.role}</div>
        <div style="font-size:11px;color:#525252;margin-bottom:8px">${m.zodiac}</div>
        <p style="font-size:12px;color:#A3A3A3;line-height:1.65;margin-bottom:10px">${m.bio}</p>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">${m.tags.map(tg=>`<span style="font-size:10px;background:#262626;color:#737373;border-radius:5px;padding:2px 7px">${tg}</span>`).join("")}</div>
        <a href="${m.ig}" target="_blank" style="font-size:11px;color:#E1306C">Instagram ↗</a>
      </div>`).join("")}</div>`;

  } else if(aboutTab==="disc"){
    const colors=["#7C3AED","#1DB954","#F59E0B","#EF4444","#EC4899","#3B82F6"];
    content=`<div class="disc-grid">${BAND.discography.map((s,i)=>{
      const c=colors[i%colors.length];
      const img=IMGS.songs[s.title];
      return`<div class="dcard" style="border-left:3px solid ${c}">
        ${img?`<div class="img-box" style="height:140px"><img src="${img}" onerror="this.parentElement.style.display='none'"/></div>`:""}
        <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:4px">${s.title}</div>
        <div style="font-size:11px;color:#525252;margin-bottom:8px">${s.year}</div>
        <p style="font-size:12px;color:#A3A3A3;line-height:1.65;margin-bottom:8px">${s.desc}</p>
        <div style="font-size:11px;color:${c};background:${c}18;border-radius:5px;padding:4px 8px">${s.stats}</div>
      </div>`;
    }).join("")}</div>`;

  } else if(aboutTab==="timeline"){
    content=`
    <div class="timeline">${BAND.timeline.map(item=>`
      <div class="titem">
        <div class="tdate">${item.d}</div>
        <div class="tcontent">${item.t}</div>
      </div>`).join("")}
    </div>
    <div style="margin-top:20px">
      <div style="font-size:12px;color:#737373;font-weight:600;margin-bottom:12px;letter-spacing:.5px">📸 演出紀錄</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">
        <div class="img-box" style="height:220px"><img src="${IMGS.live1}" style="object-position:center center" onerror="this.parentElement.style.display='none'"/></div>
        <div class="img-box" style="height:220px"><img src="${IMGS.live2}" style="object-position:center center" onerror="this.parentElement.style.display='none'"/></div>
      </div>
    </div>`;

  } else if(aboutTab==="audience"){
    content=`
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:16px">
      ${[{icon:"⚧",label:"性別分佈",val:BAND.ta.gender},{icon:"🎂",label:"年齡分佈",val:BAND.ta.age},{icon:"🌏",label:"地區分佈",val:BAND.ta.region}].map(it=>`
      <div class="card">
        <div style="font-size:20px;margin-bottom:8px">${it.icon}</div>
        <div style="font-size:12px;color:#737373;margin-bottom:6px;font-weight:600">${it.label}</div>
        <div style="font-size:13px;color:#E5E5E5;line-height:1.65">${it.val}</div>
      </div>`).join("")}
      <div class="card" style="grid-column:1/-1">
        <div style="font-size:12px;color:#737373;font-weight:600;margin-bottom:8px">🎵 Spotify 歌單成效</div>
        <div style="font-size:13px;color:#A3A3A3;line-height:1.75">每次新歌釋出均會被加入 <span style="color:#1DB954;font-weight:700">3～4 個 Spotify 官方歌單</span>，顯示演算法推薦效果穩定。目前亞洲市場發展潛力較歐美高，臺灣為最大聽眾市場（2,801 人），其後依序為新加坡、香港、馬來西亞。</div>
      </div>
    </div>
    <div class="img-box" style="height:300px"><img src="${IMGS.liveGroup}" style="object-position:center 30%" onerror="this.parentElement.style.display='none'"/></div>`;
  }

  return`<div class="card" style="margin-bottom:18px">
    <div class="tab-nav">${nav}</div>
    <div class="fade-in">${content}</div>
  </div>`;
}
window.setAboutTab=function(k){aboutTab=k;document.getElementById("aboutSec").innerHTML=renderAbout();};

function kpiCard(id,icon,accent,label,value,deltaRaw,pending,histHtml){
  const d=deltaRaw?fD(deltaRaw):null;
  const dim=value==="—"?"#404040":"#E5E5E5";
  return`<div class="kpi" onclick="toggleChart('${id}')">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:32px;height:32px;border-radius:8px;background:${accent}22;display:flex;align-items:center;justify-content:center;font-size:15px">${icon}</div>
        <span style="font-size:11px;color:#737373">${label}</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        ${pending?`<span style="font-size:10px;color:#525252;background:#1F1F1F;border-radius:4px;padding:2px 6px">${t("pend")}</span>`:""}
        <span id="arr_${id}" style="font-size:10px;color:#525252">▼</span>
      </div>
    </div>
    <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;color:${dim}">${value}</div>
    ${d?`<div style="font-size:12px;font-weight:600;margin-top:4px;color:${d.c}">${d.s} ${t("md")}</div>`:""}
    <div id="ch_${id}" style="display:none">
      <div style="font-size:11px;color:#525252;margin:10px 0 2px">${t("hist")}</div>
      ${histHtml}
    </div>
  </div>`;
}
window.toggleChart=function(id){
  const el=document.getElementById("ch_"+id);
  const ar=document.getElementById("arr_"+id);
  if(!el)return;
  const o=el.style.display==="none";
  el.style.display=o?"block":"none";
  if(ar)ar.textContent=o?"▲":"▼";
};

window.genAI=async function(){
  const btn=document.getElementById("aibtn");
  const res=document.getElementById("aires");
  if(!btn||!res)return;
  btn.disabled=true;
  btn.innerHTML=`<span class="spinner"></span>${t("aiLoad")}`;
  res.innerHTML=`<div style="color:#525252;font-size:12px;padding:20px 0;text-align:center">${t("aiLoad")}</div>`;
  const agg=buildAgg(allRows);
  const m=`IG粉絲:${agg["IG 粉絲數"]||"未填"}(月增:${agg["IG 月增減"]||"—"}) Spotify月聽眾:${agg["Spotify 月聽眾量"]||"未填"} YouTube訂閱:${agg["YouTube 訂閱數"]||"未填"}(月增:${agg["YouTube 月訂閱增減"]||"—"}) YT總觀看:${agg["YouTube 總觀看量"]||"未填"} 媒體報導:${agg["媒體新聞牆"]||"無"}`;
  const sys=lang==="zh"?`你是台灣獨立音樂的資深行銷顧問。樂團 Endless 是台灣 Modern Metalcore 樂團，以 Hyperpop/EDM 元素融合著稱，聽眾以 25-34 歲男性為主。根據當月數據，分兩區塊回覆：\n【快速建議】3條立即可執行的具體行動（每條一行，數字編號，50字內）\n【深度分析】2~3段洞察，含數據解讀、市場機會、中長期策略。繁體中文，語氣專業親切。`:`You are a senior music marketing consultant for Taiwanese indie band Endless (Modern Metalcore/Hyperpop). Reply in two sections:\n[Quick Tips] 3 immediately actionable items (numbered, one line each)\n[Deep Analysis] 2-3 paragraphs of insights. Professional English.`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sys,messages:[{role:"user",content:`Endless 本月數據：${m}`}]})});
    if(!r.ok)throw new Error("API "+r.status);
    const data=await r.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    const qm=text.match(/【快速建議】([\s\S]*?)(?=【深度分析】|$)/)||text.match(/\[Quick Tips\]([\s\S]*?)(?=\[Deep Analysis\]|$)/);
    const dm=text.match(/【深度分析】([\s\S]*?)$/)||text.match(/\[Deep Analysis\]([\s\S]*?)$/);
    const qL=(qm?.[1]||"").trim().split("\n").filter(Boolean);
    const dT=(dm?.[1]||"").trim();
    let html="";
    if(qL.length){html+=`<div style="font-size:11px;color:#F59E0B;font-weight:600;letter-spacing:.5px;margin-bottom:8px">⚡ ${t("quick")}</div>`;html+=qL.map((l,i)=>`<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px"><div style="width:18px;height:18px;border-radius:5px;background:#F59E0B22;color:#F59E0B;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">${i+1}</div><div style="font-size:13px;color:#E5E5E5;line-height:1.6">${l.replace(/^\d+[.、]/,"").trim()}</div></div>`).join("");}
    if(dT){html+=`<div style="font-size:11px;color:#7C3AED;font-weight:600;letter-spacing:.5px;margin:14px 0 8px">🔍 ${t("deep")}</div>`;html+=dT.split(/\n\n+/).filter(Boolean).map(p=>`<p style="font-size:13px;color:#A3A3A3;line-height:1.75;margin-bottom:10px">${p.trim()}</p>`).join("");}
    if(!html)html=`<p style="font-size:13px;color:#A3A3A3;line-height:1.75;white-space:pre-wrap">${text}</p>`;
    res.innerHTML=`<div class="fade-in">${html}</div>`;
  }catch(e){res.innerHTML=`<div style="color:#EF4444;font-size:12px">AI 服務暫時無法使用：${e.message}</div>`;}
  finally{btn.disabled=false;btn.innerHTML=t("aiBtn");}
};

function render(){
  document.getElementById("hSub").textContent=t("sub");
  document.getElementById("lBtn").textContent=t("lb");
  if(!allRows.length)return;
  const agg=buildAgg(allRows);
  const hist=buildHist(allRows);
  const srch=document.getElementById("srch").value.toLowerCase();
  const press=parsePress(agg["媒體新聞牆"]);
  const top3=parseList(agg["Spotify 本月熱門 Top 3"]);
  const pls=parseList(agg["Spotify 指標歌單紀錄"]);
  const fp=srch?press.filter(p=>(p.title+p.source).toLowerCase().includes(srch)):press;
  const igP=!agg["IG 粉絲數"]||parseInt(agg["IG 粉絲數"]||0)===0;
  const spP=!agg["Spotify 月聽眾量"]||parseInt(agg["Spotify 月聽眾量"]||0)===0;

  document.getElementById("main").innerHTML=`
  <div id="aboutSec">${renderAbout()}</div>
  <div class="g4">
    ${kpiCard("ig","📷","#E1306C",t("ig"),fN(agg["IG 粉絲數"]),agg["IG 月增減"],igP,miniChart(hist,"ig","#E1306C"))}
    ${kpiCard("sp","🎵","#1DB954",t("sp"),fN(agg["Spotify 月聽眾量"]),agg["Spotify 月聽眾量增減"],spP,miniChart(hist,"sp","#1DB954"))}
    ${kpiCard("ytS","▶","#FF4444",t("ytS"),fN(agg["YouTube 訂閱數"]),agg["YouTube 月訂閱增減"],false,miniChart(hist,"ytS","#FF4444"))}
    ${kpiCard("ytT","📊","#F59E0B",t("ytT"),fN(agg["YouTube 總觀看量"]),null,false,miniChart(hist,"ytT","#F59E0B"))}
  </div>
  <div class="g2">
    <div class="card">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:12px"><span>🎵</span><span style="font-weight:700;font-size:13px">${t("top3")}</span></div>
      ${top3.length?top3.map((tr,i)=>`<div style="display:flex;align-items:center;gap:9px;padding:7px 0;${i<top3.length-1?"border-bottom:1px solid #1F1F1F":""}"><span style="width:20px;height:20px;border-radius:5px;background:#1DB95422;color:#1DB954;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span><span style="font-size:13px;color:#E5E5E5">${tr}</span></div>`).join(""):`<div style="color:#525252;font-size:13px">${t("noData")}</div>`}
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:12px"><span>📋</span><span style="font-weight:700;font-size:13px">${t("pl")}</span></div>
      ${pls.length?pls.map((l,i)=>`<div style="font-size:12px;color:#A3A3A3;line-height:1.7;padding:5px 0;${i<pls.length-1?"border-bottom:1px solid #1F1F1F":""}">${l}</div>`).join(""):`<div style="color:#525252;font-size:13px">${t("noData")}</div>`}
    </div>
  </div>
  <div class="gp">
    <div>
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:12px">
        <span>📰</span><span style="font-weight:700;font-size:13px">${t("press")}</span>
        <span style="font-size:10px;color:#525252;background:#1F1F1F;border-radius:4px;padding:2px 6px">${fp.length}</span>
      </div>
      ${fp.length?fp.map(item=>`<div class="pcard"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#E5E5E5;line-height:1.5;margin-bottom:3px">${item.title}</div>${item.source?`<div style="font-size:11px;color:#525252">${item.source}</div>`:""}</div>${item.url?`<a href="${item.url}" target="_blank" style="color:#7C3AED;flex-shrink:0;font-size:14px">↗</a>`:""}</div></div>`).join(""):`<div style="color:#525252;font-size:13px;padding:28px 0;text-align:center">${t("noData")}</div>`}
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:7px"><span>💡</span><span style="font-weight:700;font-size:13px">${t("camp")}</span></div>
        <button id="aibtn" class="btn btnp" onclick="genAI()">${t("aiBtn")}</button>
      </div>
      <div id="aires" style="color:#525252;font-size:12px;text-align:center;padding:20px 0">${t("aiPh")}</div>
    </div>
  </div>`;

  document.getElementById("main").style.display="block";
  document.getElementById("main").className="fade-in";
}

window.loadData=async function(){
  document.getElementById("loading").style.display="flex";
  document.getElementById("main").style.display="none";
  try{
    const res=await fetch(GAS);
    if(!res.ok)throw new Error("HTTP "+res.status);
    allRows=await res.json();
    if(!Array.isArray(allRows))allRows=[];
    document.getElementById("hUpd").textContent=t("upd")+": "+new Date().toLocaleDateString("zh-TW");
    document.getElementById("loading").style.display="none";
    render();
  }catch(e){
    document.getElementById("loading").innerHTML=`<div style="text-align:center"><div style="font-size:26px;margin-bottom:12px">⚠️</div><div style="color:#737373;font-size:13px;margin-bottom:6px">${t("err")}</div><div style="color:#404040;font-size:11px;margin-bottom:14px">${e.message}</div><button class="btn btnp" onclick="loadData()">${t("retry")}</button></div>`;
  }
};
window.toggleLang=function(){lang=lang==="zh"?"en":"zh";render();};
document.getElementById("srch").addEventListener("input",()=>{if(allRows.length)render();});
loadData();
</script>
</body>
</html>
