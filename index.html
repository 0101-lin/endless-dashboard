<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Endless 樂團數據儀表板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0A;color:#E5E5E5;font-family:'Inter',-apple-system,sans-serif;min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#525252}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade-in{animation:fadeIn .35s ease both}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0A0A0A}
::-webkit-scrollbar-thumb{background:#262626;border-radius:3px}

/* Layout */
#app{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
header{position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid #171717;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 20px;height:62px;flex-wrap:wrap}

/* Cards */
.card{background:#171717;border:1px solid #262626;border-radius:14px;padding:1rem 1.2rem}
.kpi-card{background:#171717;border:1px solid #262626;border-radius:14px;padding:1rem 1.2rem;cursor:pointer;transition:transform .2s,box-shadow .2s}
.kpi-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.6)}
.press-card{background:#171717;border:1px solid #262626;border-left:3px solid #7C3AED;border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:transform .2s,box-shadow .2s}
.press-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.5)}

/* Grid */
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:20px}
.grid-press{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}

/* Bio */
.bio-block{background:#111;border:1px solid #1F1F1F;border-radius:14px;padding:1.2rem 1.4rem;margin-bottom:20px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}

/* Spinner */
.spinner{width:36px;height:36px;border:2px solid #262626;border-top:2px solid #7C3AED;border-radius:50%;animation:spin .8s linear infinite}

/* Buttons */
.btn{border:none;border-radius:8px;padding:6px 14px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#7C3AED;color:#fff}
.btn-primary:hover{background:#6D28D9}
.btn-secondary{background:#171717;border:1px solid #262626;color:#A3A3A3}
.btn-icon{background:none;border:1px solid #262626;border-radius:8px;padding:6px 8px;color:#525252}

/* Chart */
.chart-wrap{height:150px;margin-top:12px;position:relative}
.chart-svg{width:100%;height:100%}

/* Section label */
.sec-label{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.sec-label span.cnt{font-size:10px;color:#525252;background:#1F1F1F;border-radius:5px;padding:2px 7px}
.tag{font-size:11px;border-radius:6px;padding:3px 10px;font-weight:600}

/* AI result */
.ai-section-title{font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.ai-quick-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.ai-quick-num{width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#7C3AED,#EC4899);display:flex;align-items:center;justify-content:center;font-size:17px">🎵</div>
      <div>
        <div style="font-size:18px;font-weight:800;color:#fff;letter-spacing:-.5px">Endless</div>
        <div id="h-subtitle" style="font-size:10px;color:#525252;margin-top:-2px">樂團數據儀表板</div>
      </div>
    </div>
    <div style="flex:1;min-width:140px">
      <div style="display:flex;align-items:center;gap:7px;background:#171717;border:1px solid #262626;border-radius:9px;padding:7px 12px">
        <span style="font-size:13px;color:#525252">🔍</span>
        <input id="search" placeholder="搜尋新聞、靈感…" style="background:none;border:none;outline:none;color:#E5E5E5;font-size:12px;width:100%"/>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <span id="h-updated" style="font-size:10px;color:#404040"></span>
      <button class="btn-icon" onclick="loadData()" title="重新載入">↻</button>
      <button class="btn btn-secondary" onclick="toggleLang()">🌐 <span id="lang-btn">EN</span></button>
    </div>
  </div>
</header>

<div id="app">
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:16px">
    <div class="spinner"></div>
    <span style="color:#525252;font-size:13px">資料載入中…</span>
  </div>
  <div id="main" style="display:none"></div>
</div>

<script>
// ══ Config ═══════════════════════════════════════════
const GAS_URL="https://script.google.com/macros/s/AKfycbxG8gHyA2w1bJjTIvqSD2HN1wJRHBgxc9aV5wg5v-yAzZaQl0U5GX98pxILCySmMa5e/exec";
const BAND={
  name:"Endless",tagline:"台灣獨立搖滾樂團",
  bio:"Endless 是來自台灣的獨立搖滾樂團，以融合電吉他、電子音效與詩意歌詞著稱。自 2020 年成立以來，以強烈的舞台張力與影像化的 MV 製作獲得廣泛關注。",
  ig:"https://instagram.com",spotify:"https://open.spotify.com",yt:"https://youtube.com"
};
const T={
  zh:{subtitle:"樂團數據儀表板",search:"搜尋新聞、靈感…",langBtn:"EN",
    igFans:"IG 粉絲數",sp:"Spotify 月聽眾量",ytSubs:"YouTube 訂閱數",ytTotal:"YouTube 總觀看量",
    top3:"Spotify 本月 Top 3",playlist:"指標歌單紀錄",press:"媒體新聞牆",campaigns:"行銷靈感庫",
    pending:"待更新",monthDelta:"月增減",history:"歷史趨勢",noData:"暫無資料",
    updated:"最後更新",retry:"重試",error:"資料讀取失敗",
    aiBtn:"✦ AI 生成行銷建議",aiLoading:"AI 分析中…",aiPlaceholder:"點擊按鈕，AI 將根據本月數據自動生成行銷建議",
    quick:"快速建議",deep:"深度分析",noHistory:"歷史資料不足（需 2 筆以上）"},
  en:{subtitle:"Band Analytics Dashboard",search:"Search news, ideas…",langBtn:"中文",
    igFans:"IG Followers",sp:"Spotify Monthly Listeners",ytSubs:"YouTube Subscribers",ytTotal:"YouTube Total Views",
    top3:"Spotify Top 3 This Month",playlist:"Playlist Log",press:"Press News",campaigns:"Campaigns",
    pending:"Pending",monthDelta:"Monthly Δ",history:"Historical Trend",noData:"No data",
    updated:"Last updated",retry:"Retry",error:"Failed to load data",
    aiBtn:"✦ Generate AI Suggestions",aiLoading:"AI thinking…",aiPlaceholder:"Click the button to generate AI marketing suggestions based on this month's data.",
    quick:"Quick Tips",deep:"Deep Analysis",noHistory:"Not enough history (need 2+ months)"}
};

let lang="zh";
let allRows=[];

// ══ Lang ══════════════════════════════════════════════
function toggleLang(){lang=lang==="zh"?"en":"zh";renderAll();}
function t(k){return T[lang][k]||k;}

// ══ Helpers ════════════════════════════════════════════
function fmtNum(v){
  if(v===null||v===undefined||v===""||v==="-")return"—";
  const n=parseInt(String(v).replace(/,/g,""))||0;
  if(!n)return"—";
  return Math.abs(n)>=10000?(n/10000).toFixed(1)+"萬":n.toLocaleString();
}
function fmtDelta(v){
  const n=parseInt(String(v||"").replace(/,/g,""))||0;
  if(n>0)return{txt:"+"+n.toLocaleString(),c:"#22C55E"};
  if(n<0)return{txt:n.toLocaleString(),c:"#EF4444"};
  return null;
}
function fmtDate(raw){
  if(!raw)return"";
  const d=new Date(raw);
  return isNaN(d)?String(raw).slice(0,7):`${d.getFullYear()}/${d.getMonth()+1}`;
}
function parsePress(raw){
  if(!raw)return[];
  return String(raw).split(/\n/).map(line=>{
    const um=line.match(/\((https?:\/\/[^)]+)\)/);
    const title=line.replace(/^\d+\.\s*/,"").replace(/\s*\(https?:\/\/[^)]+\)/,"").replace(/\s*中的YouTube影片/,"").replace(/\s*-\s*[^-（(]+$/,"").trim();
    const sm=line.match(/-\s*([^(-]+?)(?:\s*\(|$)/);
    return{title,source:sm?sm[1].trim():"",url:um?um[1]:""};
  }).filter(p=>p.title);
}
function parseList(raw){
  if(!raw)return[];
  return String(raw).split(/[\n；;]+/).map(s=>s.trim()).filter(Boolean);
}
function buildAgg(rows){
  const agg={};
  const textMerge=["行銷靈感庫","媒體新聞牆","Spotify 本月熱門 Top 3","Spotify 指標歌單紀錄"];
  rows.forEach(row=>{
    Object.entries(row).forEach(([k,v])=>{
      if(v===undefined||v===null||String(v).trim()===""||v==="-")return;
      if(textMerge.includes(k)){agg[k]=String(v);}
      else agg[k]=v;
    });
  });
  return agg;
}
function buildHistory(rows){
  const seen={};const h=[];
  rows.forEach(row=>{
    const dk=Object.values(row)[0];
    if(!dk||seen[dk])return;
    seen[dk]=true;
    h.push({
      date:fmtDate(dk),
      ig:parseInt(String(row["IG 粉絲數"]||0).replace(/,/g,""))||0,
      sp:parseInt(String(row["Spotify 月聽眾量"]||0).replace(/,/g,""))||0,
      ytS:parseInt(String(row["YouTube 訂閱數"]||0).replace(/,/g,""))||0,
      ytT:parseInt(String(row["YouTube 總觀看量"]||0).replace(/,/g,""))||0,
    });
  });
  return h.reverse();
}

// ══ Mini SVG Chart ════════════════════════════════════
function miniChart(data,field,color){
  const vals=data.map(d=>d[field]);
  const hasData=vals.some(v=>v>0);
  if(!hasData||data.length<2)return`<div style="color:#525252;font-size:12px;text-align:center;padding:18px 0">${t("noHistory")}</div>`;
  const W=560,H=120,PAD={t:8,r:10,b:32,l:52};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const xStep=cW/(data.length-1);
  const pts=data.map((d,i)=>{
    const x=PAD.l+i*xStep;
    const y=PAD.t+cH-(d[field]-min)/range*cH;
    return{x,y,v:d[field],date:d.date};
  });
  const polyline=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const area=`${PAD.l},${PAD.t+cH} `+polyline+` ${PAD.l+cW},${PAD.t+cH}`;
  const yTicks=[min,min+range/2,max].map(v=>Math.abs(v)>=10000?(v/10000).toFixed(1)+"萬":Math.round(v).toLocaleString());
  const yCoords=[PAD.t+cH,PAD.t+cH/2,PAD.t];

  let dots=pts.map((p,i)=>`
    <circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="#171717" stroke-width="2"
      onmouseover="showTip(evt,'${p.date}: ${fmtNum(p.v)}')"
      onmouseout="hideTip()"/>
  `).join("");

  return`<div style="position:relative">
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">
    <defs><linearGradient id="cg${field}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0,.5,1].map((_,i)=>`<line x1="${PAD.l}" y1="${yCoords[i]}" x2="${PAD.l+cW}" y2="${yCoords[i]}" stroke="#1F1F1F" stroke-width="1"/>`).join("")}
    ${yTicks.map((tk,i)=>`<text x="${PAD.l-6}" y="${yCoords[i]+4}" text-anchor="end" font-size="10" fill="#525252">${tk}</text>`).join("")}
    ${data.map((d,i)=>`<text x="${PAD.l+i*xStep}" y="${H-6}" text-anchor="middle" font-size="10" fill="#525252">${d.date}</text>`).join("")}
    <polygon points="${area}" fill="url(#cg${field})"/>
    <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>
  <div id="tip" style="display:none;position:absolute;background:#262626;color:#E5E5E5;font-size:11px;padding:4px 8px;border-radius:6px;pointer-events:none;top:0;left:0"></div>
</div>`;
}

window.showTip=function(evt,text){
  const tip=document.getElementById("tip");
  if(!tip)return;
  const rect=evt.target.closest("div").getBoundingClientRect();
  const cx=evt.clientX-rect.left,cy=evt.clientY-rect.top;
  tip.style.display="block";tip.style.left=(cx+8)+"px";tip.style.top=(cy-24)+"px";tip.textContent=text;
};
window.hideTip=function(){const t=document.getElementById("tip");if(t)t.style.display="none";};

// ══ KPI Card ══════════════════════════════════════════
function kpiCard(id,icon,accent,label,value,deltaRaw,pending,histHtml){
  const d=fmtDelta(deltaRaw);
  const dim=value==="—"?"#404040":"#E5E5E5";
  return`<div class="kpi-card" id="kpi-${id}" onclick="toggleChart('${id}')">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:9px">
        <div style="width:34px;height:34px;border-radius:9px;background:${accent}22;display:flex;align-items:center;justify-content:center;font-size:16px">${icon}</div>
        <span style="font-size:11px;color:#737373">${label}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${pending?`<span style="font-size:10px;color:#525252;background:#1F1F1F;border-radius:5px;padding:2px 7px">${t("pending")}</span>`:""}
        <span id="arr-${id}" style="font-size:11px;color:#525252">▼</span>
      </div>
    </div>
    <div style="font-size:28px;font-weight:800;letter-spacing:-.5px;color:${dim}">${value}</div>
    ${d?`<div style="font-size:12px;font-weight:600;margin-top:5px;color:${d.c}">${d.txt} ${t("monthDelta")}</div>`:""}
    <div id="chart-${id}" style="display:none;margin-top:4px">
      <div style="font-size:11px;color:#525252;margin:10px 0 2px">${t("history")}</div>
      ${histHtml}
    </div>
  </div>`;
}
window.toggleChart=function(id){
  const el=document.getElementById("chart-"+id);
  const arr=document.getElementById("arr-"+id);
  if(!el)return;
  const open=el.style.display==="none";
  el.style.display=open?"block":"none";
  if(arr)arr.textContent=open?"▲":"▼";
};

// ══ AI Suggestions ════════════════════════════════════
window.generateAI=async function(){
  const btn=document.getElementById("ai-btn");
  const res=document.getElementById("ai-result");
  if(!btn||!res)return;
  btn.disabled=true;btn.innerHTML=`<span class="spinner" style="width:12px;height:12px;border-width:1.5px"></span>${t("aiLoading")}`;
  res.innerHTML=`<div style="color:#525252;font-size:12px;animation:pulse 1s infinite">${t("aiLoading")}</div>`;

  const agg=buildAgg(allRows);
  const metrics=`IG粉絲: ${agg["IG 粉絲數"]||"未填"} (月增: ${agg["IG 月增減"]||"—"})
Spotify月聽眾: ${agg["Spotify 月聽眾量"]||"未填"} (月增: ${agg["Spotify 月聽眾量增減"]||"—"})
YouTube訂閱: ${agg["YouTube 訂閱數"]||"未填"} (月增: ${agg["YouTube 月訂閱增減"]||"—"})
YouTube總觀看: ${agg["YouTube 總觀看量"]||"未填"}
本月媒體報導: ${agg["媒體新聞牆"]||"無"}`;

  const sysPr=lang==="zh"
    ?`你是台灣獨立音樂的資深行銷顧問，專精數位行銷與社群經營。根據樂團 Endless 的當月數據，提供精準的行銷建議。請分兩區塊回覆：
【快速建議】3 條可立即執行的具體行動（每條一行，50字內，用數字編號）
【深度分析】2~3 段深度洞察，包含數據解讀、市場機會與中長期策略建議。
全程使用繁體中文，語氣專業但親切。`
    :`You are a senior music marketing consultant. Provide marketing suggestions for band Endless in two sections:
[Quick Tips] 3 immediately actionable items (one line each, numbered)
[Deep Analysis] 2~3 paragraphs of insights including data interpretation, opportunities and strategy.
Use professional English.`;

  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:sysPr,
        messages:[{role:"user",content:`以下是 Endless 樂團本月數據，請給出行銷建議：\n${metrics}`}]
      })
    });
    if(!r.ok)throw new Error("API "+r.status);
    const data=await r.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    renderAIResult(text,res);
  }catch(e){
    res.innerHTML=`<div style="color:#EF4444;font-size:12px">AI 服務暫時無法使用，請稍後再試。(${e.message})</div>`;
  }finally{
    btn.disabled=false;btn.innerHTML=t("aiBtn");
  }
};

function renderAIResult(text,el){
  const qm=text.match(/【快速建議】([\s\S]*?)(?=【深度分析】|$)/)||text.match(/\[Quick Tips\]([\s\S]*?)(?=\[Deep Analysis\]|$)/);
  const dm=text.match(/【深度分析】([\s\S]*?)$/)||text.match(/\[Deep Analysis\]([\s\S]*?)$/);
  const qLines=(qm?.[1]||"").trim().split("\n").filter(Boolean);
  const dText=(dm?.[1]||"").trim();
  let html="";
  if(qLines.length){
    html+=`<div class="ai-section-title" style="color:#F59E0B">⚡ ${t("quick")}</div>`;
    html+=qLines.map((l,i)=>`<div class="ai-quick-item">
      <div class="ai-quick-num" style="background:#F59E0B22;color:#F59E0B">${i+1}</div>
      <div style="font-size:13px;color:#E5E5E5;line-height:1.6">${l.replace(/^\d+[.、]/,"").trim()}</div>
    </div>`).join("");
  }
  if(dText){
    html+=`<div class="ai-section-title" style="color:#7C3AED;margin-top:14px">🔍 ${t("deep")}</div>`;
    html+=dText.split(/\n\n+/).filter(Boolean).map(p=>`<p style="font-size:13px;color:#A3A3A3;line-height:1.75;margin-bottom:10px">${p.trim()}</p>`).join("");
  }
  if(!html)html=`<p style="font-size:13px;color:#A3A3A3;line-height:1.75;white-space:pre-wrap">${text}</p>`;
  el.innerHTML=`<div class="fade-in">${html}</div>`;
}

// ══ Render ════════════════════════════════════════════
function renderAll(){
  // Update header i18n
  document.getElementById("h-subtitle").textContent=t("subtitle");
  document.getElementById("search").placeholder=t("search");
  document.getElementById("lang-btn").textContent=t("langBtn");

  if(!allRows.length)return;
  const agg=buildAgg(allRows);
  const hist=buildHistory(allRows);
  const search=document.getElementById("search").value.toLowerCase();

  const pressItems=parsePress(agg["媒体新聞牆"]||agg["媒體新聞牆"]);
  const top3=parseList(agg["Spotify 本月熱門 Top 3"]);
  const playlists=parseList(agg["Spotify 指標歌單紀錄"]);
  const fPress=search?pressItems.filter(p=>(p.title+p.source).toLowerCase().includes(search)):pressItems;

  const igPend=!agg["IG 粉絲數"]||parseInt(agg["IG 粉絲數"]||0)===0;
  const spPend=!agg["Spotify 月聽眾量"]||parseInt(agg["Spotify 月聽眾量"]||0)===0;

  const html=`
  <!-- Bio -->
  <div class="bio-block">
    <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#7C3AED,#EC4899);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🎵</div>
    <div style="flex:1;min-width:200px">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap">
        <span style="font-size:18px;font-weight:800;color:#fff;letter-spacing:-.5px">${BAND.name}</span>
        <span style="font-size:12px;color:#525252">${BAND.tagline}</span>
      </div>
      <p style="font-size:13px;color:#A3A3A3;line-height:1.7;margin-bottom:10px">${BAND.bio}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a href="${BAND.ig}" target="_blank" class="tag" style="color:#E1306C;background:#E1306C18;border:1px solid #E1306C33">Instagram ↗</a>
        <a href="${BAND.spotify}" target="_blank" class="tag" style="color:#1DB954;background:#1DB95418;border:1px solid #1DB95433">Spotify ↗</a>
        <a href="${BAND.yt}" target="_blank" class="tag" style="color:#FF4444;background:#FF444418;border:1px solid #FF444433">YouTube ↗</a>
      </div>
    </div>
  </div>

  <!-- KPIs -->
  <div class="grid-4">
    ${kpiCard("ig","📷","#E1306C",t("igFans"),fmtNum(agg["IG 粉絲數"]),agg["IG 月增減"],igPend,miniChart(hist,"ig","#E1306C"))}
    ${kpiCard("sp","🎵","#1DB954",t("sp"),fmtNum(agg["Spotify 月聽眾量"]),agg["Spotify 月聽眾量增減"],spPend,miniChart(hist,"sp","#1DB954"))}
    ${kpiCard("ytS","▶","#FF4444",t("ytSubs"),fmtNum(agg["YouTube 訂閱數"]),agg["YouTube 月訂閱增減"],false,miniChart(hist,"ytS","#FF4444"))}
    ${kpiCard("ytT","📊","#F59E0B",t("ytTotal"),fmtNum(agg["YouTube 總觀看量"]),null,false,miniChart(hist,"ytT","#F59E0B"))}
  </div>

  <!-- Spotify panels -->
  <div class="grid-2">
    <div class="card">
      <div class="sec-label"><span>🎵</span><span style="font-weight:700;font-size:13px">${t("top3")}</span></div>
      ${top3.length?top3.map((tr,i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;${i<top3.length-1?"border-bottom:1px solid #1F1F1F":""}">
          <span style="width:22px;height:22px;border-radius:6px;background:#1DB95422;color:#1DB954;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span>
          <span style="font-size:13px;color:#E5E5E5">${tr}</span>
        </div>`).join(""):`<div style="color:#525252;font-size:13px">${t("noData")}</div>`}
    </div>
    <div class="card">
      <div class="sec-label"><span>📋</span><span style="font-weight:700;font-size:13px">${t("playlist")}</span></div>
      ${playlists.length?playlists.map((l,i)=>`<div style="font-size:12px;color:#A3A3A3;line-height:1.7;padding:5px 0;${i<playlists.length-1?"border-bottom:1px solid #1F1F1F":""}">${l}</div>`).join(""):`<div style="color:#525252;font-size:13px">${t("noData")}</div>`}
    </div>
  </div>

  <!-- Press + AI -->
  <div class="grid-press">
    <div>
      <div class="sec-label">
        <span>📰</span>
        <span style="font-weight:700;font-size:13px">${t("press")}</span>
        <span class="cnt">${fPress.length}</span>
      </div>
      ${fPress.length?fPress.map(item=>`
        <div class="press-card">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600;color:#E5E5E5;line-height:1.5;margin-bottom:4px">${item.title}</div>
              ${item.source?`<div style="font-size:11px;color:#525252">${item.source}</div>`:""}
            </div>
            ${item.url?`<a href="${item.url}" target="_blank" rel="noreferrer" style="color:#7C3AED;flex-shrink:0;font-size:14px;margin-top:2px">↗</a>`:""}
          </div>
        </div>`).join(""):`<div style="color:#525252;font-size:13px;padding:28px 0;text-align:center">${t("noData")}</div>`}
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="sec-label" style="margin-bottom:0"><span>💡</span><span style="font-weight:700;font-size:13px">${t("campaigns")}</span></div>
        <button id="ai-btn" class="btn btn-primary" onclick="generateAI()">${t("aiBtn")}</button>
      </div>
      <div id="ai-result" style="color:#525252;font-size:12px;text-align:center;padding:20px 0">${t("aiPlaceholder")}</div>
    </div>
  </div>`;

  document.getElementById("main").innerHTML=html;
  document.getElementById("main").style.display="block";
  document.getElementById("main").className="fade-in";
}

// ══ Data Load ════════════════════════════════════════
window.loadData=async function(){
  document.getElementById("loading").style.display="flex";
  document.getElementById("main").style.display="none";
  try{
    const res=await fetch(GAS_URL);
    if(!res.ok)throw new Error("HTTP "+res.status);
    allRows=await res.json();
    if(!Array.isArray(allRows))allRows=[];
    document.getElementById("h-updated").textContent=t("updated")+": "+new Date().toLocaleDateString("zh-TW");
    document.getElementById("loading").style.display="none";
    renderAll();
  }catch(e){
    document.getElementById("loading").innerHTML=`
      <div style="text-align:center">
        <div style="font-size:28px;margin-bottom:12px">⚠️</div>
        <div style="color:#737373;font-size:13px;margin-bottom:6px">${t("error")}</div>
        <div style="color:#404040;font-size:11px;margin-bottom:16px">${e.message}</div>
        <button class="btn btn-primary" onclick="loadData()">${t("retry")}</button>
      </div>`;
  }
};

// ══ Search ════════════════════════════════════════════
document.getElementById("search").addEventListener("input",()=>{if(allRows.length)renderAll();});

// ══ Init ═════════════════════════════════════════════
loadData();
</script>
</body>
</html>
