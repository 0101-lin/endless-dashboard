<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Endless 樂團數據儀表板</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0A0A0A;color:#E5E5E5;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}

    input::placeholder{color:#525252}
    textarea::placeholder{color:#525252}
    textarea{resize:none}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;
const {LineChart,Line,XAxis,YAxis,Tooltip,ResponsiveContainer,CartesianGrid} = Recharts;

// ══ 設定 ══════════════════════════════════════════════
const GAS_URL = "https://script.google.com/macros/s/AKfycbxG8gHyA2w1bJjTIvqSD2HN1wJRHBgxc9aV5wg5v-yAzZaQl0U5GX98pxILCySmMa5e/exec";

const BAND_INFO = {
  name: "Endless",
  tagline: "台灣獨立搖滾樂團",
  bio: "Endless 是來自台灣的獨立搖滾樂團，以融合電吉他、電子音效與詩意歌詞著稱。自 2020 年成立以來，以強烈的舞台張力與影像化的 MV 製作獲得廣泛關注。",
  links: {
    instagram: "https://instagram.com",
    spotify: "https://open.spotify.com",
    youtube: "https://youtube.com",
  }
};

const T = {
  zh:{
    title:"Endless",subtitle:"樂團數據儀表板",search:"搜尋新聞、靈感…",
    igFans:"IG 粉絲數",spotifyListeners:"Spotify 月聽眾量",
    ytSubs:"YouTube 訂閱數",ytTotal:"YouTube 總觀看量",
    topTracks:"Spotify 本月 Top 3",playlistLog:"指標歌單紀錄",
    press:"媒體新聞牆",campaigns:"行銷靈感庫",
    loading:"資料載入中…",error:"資料讀取失敗，請稍後再試。",
    retry:"重試",noData:"暫無資料",switchLang:"EN",
    updated:"最後更新",pending:"待更新",
    history:"歷史趨勢",hideHistory:"收起",
    about:"關於 Endless",
    aiBtn:"✦ AI 生成行銷建議",aiLoading:"AI 分析中…",
    quick:"快速建議",deep:"深度分析",
    monthlyDelta:"月增減",
  },
  en:{
    title:"Endless",subtitle:"Band Analytics Dashboard",search:"Search news, ideas…",
    igFans:"IG Followers",spotifyListeners:"Spotify Monthly Listeners",
    ytSubs:"YouTube Subscribers",ytTotal:"YouTube Total Views",
    topTracks:"Spotify Top 3 This Month",playlistLog:"Playlist Log",
    press:"Press News",campaigns:"Campaigns",
    loading:"Loading data…",error:"Failed to load data. Please try again.",
    retry:"Retry",noData:"No data available",switchLang:"中文",
    updated:"Last updated",pending:"Pending",
    history:"Historical Trend",hideHistory:"Hide",
    about:"About Endless",
    aiBtn:"✦ Generate AI Suggestions",aiLoading:"AI thinking…",
    quick:"Quick Tips",deep:"Deep Analysis",
    monthlyDelta:"Monthly Δ",
  }

// ══ Helpers ═══════════════════════════════════════════
function fmtNum(v){
  if(v===null||v===undefined||v===""||v==="-")return"—";
  const n=parseInt(String(v).replace(/,/g,""))||0;
  if(n===0)return"—";
  if(Math.abs(n)>=10000)return(n/10000).toFixed(1)+"萬";
  return n.toLocaleString();
}
function fmtDelta(v){
  if(!v||v==="-"||v===0)return null;
  const n=parseInt(String(v).replace(/,/g,""))||0;
  if(n>0)return{txt:"+"+n.toLocaleString(),color:"#22C55E"};
  if(n<0)return{txt:n.toLocaleString(),color:"#EF4444"};
  return null;
}
function fmtDate(raw){
  if(!raw)return"";
  const d=new Date(raw);
  if(isNaN(d))return String(raw).slice(0,10);
  return`${d.getFullYear()}/${d.getMonth()+1}`;
}
function parsePress(raw){
  if(!raw)return[];
  return String(raw).split(/\n/).map(line=>{
    const urlMatch=line.match(/\((https?:\/\/[^)]+)\)/);
    const title=line.replace(/^\d+\.\s*/,"").replace(/\s*\(https?:\/\/[^)]+\)/,"").replace(/\s*中的YouTube影片/,"").replace(/\s*-\s*[^-（(]+$/,"").trim();
    const sourceMatch=line.match(/-\s*([^(-]+?)(?:\s*\(|$)/);
    return{title,source:sourceMatch?sourceMatch[1].trim():"",url:urlMatch?urlMatch[1]:""};
  }).filter(p=>p.title);
}
function parseList(raw){
  if(!raw)return[];
  return String(raw).split(/[\n；;]+/).map(s=>s.trim()).filter(Boolean);
}

// ══ Data hook ═════════════════════════════════════════
function useData(){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [lastUpdated,setLastUpdated]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);setError(null);
    try{
      const res=await fetch(GAS_URL);
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const json=await res.json();
      setRows(Array.isArray(json)?json:[]);
      setLastUpdated(new Date().toLocaleDateString("zh-TW"));
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{load();},[load]);
  return{rows,loading,error,lastUpdated,refetch:load};
}

// Build latest aggregated row + all rows for history
function buildData(rows){
  if(!rows.length)return{agg:{},history:[]};
  const textMerge=["行銷靈感庫","媒體新聞牆","Spotify 本月熱門 Top 3","Spotify 指標歌單紀錄"];
  // latest: last row wins for each field
  const agg={};
  rows.forEach(row=>{
    Object.entries(row).forEach(([k,v])=>{
      if(v===undefined||v===null||String(v).trim()===""||v==="-")return;
      if(textMerge.includes(k)){agg[k]=String(v);}
      else{agg[k]=v;}
    });
  });
  // history: one entry per unique date key
  const seen={};
  const history=[];
  rows.forEach(row=>{
    const dateKey=Object.values(row)[0];
    if(!dateKey||seen[dateKey])return;
    seen[dateKey]=true;
    history.push({
      date:fmtDate(dateKey),
      ig:parseInt(String(row["IG 粉絲數"]||0).replace(/,/g,""))||0,
      spotify:parseInt(String(row["Spotify 月聽眾量"]||0).replace(/,/g,""))||0,
      ytSubs:parseInt(String(row["YouTube 訂閱數"]||0).replace(/,/g,""))||0,
      ytTotal:parseInt(String(row["YouTube 總觀看量"]||0).replace(/,/g,""))||0,
    });
  });
  return{agg,history:history.reverse()};
}

// ══ AI Suggestions ════════════════════════════════════
async function fetchAISuggestions(agg,lang){
  const metrics=`
IG粉絲: ${agg["IG 粉絲數"]||"未填"} (月增: ${agg["IG 月增減"]||"—"})
Spotify月聽眾: ${agg["Spotify 月聽眾量"]||"未填"} (月增: ${agg["Spotify 月聽眾量增減"]||"—"})
YouTube訂閱: ${agg["YouTube 訂閱數"]||"未填"} (月增: ${agg["YouTube 月訂閱增減"]||"—"})
YouTube總觀看: ${agg["YouTube 總觀看量"]||"未填"}
本月媒體報導: ${agg["媒體新聞牆"]||"無"}`;

  const sysPrompt=lang==="zh"
    ?`你是台灣獨立音樂的資深行銷顧問，專精數位行銷與社群經營。根據樂團 Endless 的當月數據，提供精準的行銷建議。請分兩區塊回覆：
【快速建議】3 條可立即執行的具體行動（每條一行，50字內）
【深度分析】2~3 段深度洞察，包含數據解讀、市場機會與中長期策略建議。
全程使用繁體中文，語氣專業但親切。`
    :`You are a senior music marketing consultant specializing in digital strategy for indie artists. Based on the monthly data for band Endless, provide precise marketing suggestions in two sections:
[Quick Tips] 3 immediately actionable items (one line each, under 60 chars)
[Deep Analysis] 2~3 paragraphs of insights including data interpretation, market opportunities and mid-term strategy.
Use professional but approachable English.`;

  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1000,
      system:sysPrompt,
      messages:[{role:"user",content:`以下是 Endless 樂團本月數據，請給出行銷建議：\n${metrics}`}]
    })
  });
  if(!res.ok)throw new Error(`API ${res.status}`);
  const data=await res.json();
  return(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}

// ══ UI Components ══════════════════════════════════════

function HistoryChart({history,field,color,label}){
  if(!history||history.length<2)return(
    <div style={{color:"#525252",fontSize:12,textAlign:"center",padding:"20px 0"}}>歷史資料不足（需 2 筆以上）</div>
  );
  const hasData=history.some(h=>h[field]>0);
  if(!hasData)return(
    <div style={{color:"#525252",fontSize:12,textAlign:"center",padding:"20px 0"}}>尚無歷史數據</div>
  );
  return(
    <div style={{height:160,marginTop:12}}>
      <ResponsiveContainer width="100%" height="100%">
        <LineChart data={history} margin={{top:4,right:8,left:0,bottom:4}}>
          <CartesianGrid strokeDasharray="3 3" stroke="#1F1F1F"/>
          <XAxis dataKey="date" tick={{fill:"#525252",fontSize:11}} axisLine={false} tickLine={false}/>
          <YAxis tick={{fill:"#525252",fontSize:11}} axisLine={false} tickLine={false} width={48}
            tickFormatter={v=>v>=10000?(v/10000).toFixed(1)+"萬":v.toLocaleString()}/>
          <Tooltip
            contentStyle={{background:"#171717",border:"1px solid #262626",borderRadius:8,fontSize:12}}
            labelStyle={{color:"#A3A3A3"}}
            itemStyle={{color:color}}
            formatter={v=>[v>=10000?(v/10000).toFixed(1)+"萬":v.toLocaleString(),label]}
          />
          <Line type="monotone" dataKey={field} stroke={color} strokeWidth={2}
            dot={{fill:color,r:3}} activeDot={{r:5}}/>
        </LineChart>
      </ResponsiveContainer>
    </div>
  );
}

function KpiCard({icon,accent,label,value,delta,pending,historyData,histField,histLabel,t}){
  const [open,setOpen]=useState(false);
  const d=delta!==undefined?fmtDelta(delta):null;
  return(
    <div className="kpi-card" style={{background:"#171717",border:"1px solid #262626",borderRadius:14,padding:"1rem 1.2rem",cursor:"pointer"}}
      onClick={()=>setOpen(o=>!o)}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:34,height:34,borderRadius:9,background:accent+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{icon}</div>
          <span style={{fontSize:11,color:"#737373"}}>{label}</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {pending&&<span style={{fontSize:10,color:"#525252",background:"#1F1F1F",borderRadius:5,padding:"2px 7px"}}>{t.pending}</span>}
          <span style={{fontSize:11,color:"#525252"}}>{open?"▲":"▼"}</span>
        </div>
      </div>
      <div style={{fontSize:28,fontWeight:800,letterSpacing:"-0.5px",color:value==="—"?"#404040":"#E5E5E5"}}>{value}</div>
      {d&&<div style={{fontSize:12,fontWeight:600,marginTop:5,color:d.color}}>{d.txt} {t.monthlyDelta}</div>}
      {open&&(
        <div onClick={e=>e.stopPropagation()}>
          <div style={{fontSize:11,color:"#525252",marginTop:14,marginBottom:2}}>{t.history}</div>
          <HistoryChart history={historyData} field={histField} color={accent} label={histLabel}/>
        </div>
      )}
    </div>
  );
}

function PressCard({item}){
  return(
    <div className="press-card" style={{background:"#171717",border:"1px solid #262626",borderLeft:"3px solid #7C3AED",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:600,color:"#E5E5E5",lineHeight:1.5,marginBottom:4}}>{item.title}</div>
          {item.source&&<div style={{fontSize:11,color:"#525252"}}>{item.source}</div>}
        </div>
        {item.url&&<a href={item.url} target="_blank" rel="noreferrer" style={{color:"#7C3AED",flexShrink:0,fontSize:14,marginTop:2}}>↗</a>}
      </div>
    </div>
  );
}

function AISuggestions({agg,lang,t}){
  const [result,setResult]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const generate=async()=>{
    setLoading(true);setError("");setResult("");
    try{
      const text=await fetchAISuggestions(agg,lang);
      setResult(text);
    }catch(e){setError("AI 服務暫時無法使用，請稍後再試。");}
    finally{setLoading(false);}
  };

  // Parse quick vs deep sections
  const quickMatch=result.match(/【快速建議】([\s\S]*?)(?=【深度分析】|$)/)||result.match(/\[Quick Tips\]([\s\S]*?)(?=\[Deep Analysis\]|$)/);
  const deepMatch=result.match(/【深度分析】([\s\S]*?)$/)||result.match(/\[Deep Analysis\]([\s\S]*?)$/);
  const quickLines=(quickMatch?.[1]||"").trim().split("\n").filter(Boolean);
  const deepText=(deepMatch?.[1]||"").trim();

  return(
    <div style={{background:"#171717",border:"1px solid #262626",borderRadius:14,padding:"1.1rem 1.2rem"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <span style={{fontSize:14}}>💡</span>
          <span style={{fontWeight:700,fontSize:13}}>{t.campaigns}</span>
        </div>
        <button onClick={generate} disabled={loading}
          style={{display:"flex",alignItems:"center",gap:6,background:loading?"#1F1F1F":"#7C3AED",color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,cursor:loading?"not-allowed":"pointer",opacity:loading?.7:1,transition:"background .2s"}}>
          {loading?<><span style={{width:12,height:12,border:"1.5px solid #ffffff44",borderTop:"1.5px solid #fff",borderRadius:"50%",display:"inline-block",animation:"spin .7s linear infinite"}}></span>{t.aiLoading}</>:<>{t.aiBtn}</>}
        </button>
      </div>

      {error&&<div style={{fontSize:12,color:"#EF4444",marginBottom:10}}>{error}</div>}

      {!result&&!loading&&(
        <div style={{fontSize:12,color:"#525252",textAlign:"center",padding:"20px 0"}}>點擊按鈕，AI 將根據本月數據自動生成行銷建議</div>
      )}

      {result&&(
        <div className="fade-in">
          {quickLines.length>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:"#F59E0B",fontWeight:600,marginBottom:8,letterSpacing:"0.5px"}}>⚡ {t.quick}</div>
              {quickLines.map((line,i)=>(
                <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6}}>
                  <span style={{width:18,height:18,borderRadius:5,background:"#F59E0B22",color:"#F59E0B",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{i+1}</span>
                  <div style={{fontSize:13,color:"#E5E5E5",lineHeight:1.6}}>{line.replace(/^\d+[\.\、]/,"").trim()}</div>
                </div>
              ))}
            </div>
          )}
          {deepText&&(
            <div>
              <div style={{fontSize:11,color:"#7C3AED",fontWeight:600,marginBottom:8,letterSpacing:"0.5px"}}>🔍 {t.deep}</div>
              {deepText.split("\n\n").filter(Boolean).map((para,i)=>(
                <p key={i} style={{fontSize:13,color:"#A3A3A3",lineHeight:1.75,marginBottom:10}}>{para.trim()}</p>
              ))}
            </div>
          )}
          {(!quickLines.length&&!deepText)&&(
            <p style={{fontSize:13,color:"#A3A3A3",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{result}</p>
          )}
        </div>
      )}
    </div>
  );
}

function BandBio({t}){
  const {name,tagline,bio,links}=BAND_INFO;
  return(
    <div style={{background:"#111",border:"1px solid #1F1F1F",borderRadius:14,padding:"1.2rem 1.4rem",marginBottom:20,display:"flex",gap:20,alignItems:"flex-start",flexWrap:"wrap"}}>
      <div style={{width:52,height:52,borderRadius:14,background:"linear-gradient(135deg,#7C3AED,#EC4899)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>🎵</div>
      <div style={{flex:1,minWidth:200}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:4,flexWrap:"wrap"}}>
          <span style={{fontSize:18,fontWeight:800,color:"#fff",letterSpacing:"-0.5px"}}>{name}</span>
          <span style={{fontSize:12,color:"#525252"}}>{tagline}</span>
        </div>
        <p style={{fontSize:13,color:"#A3A3A3",lineHeight:1.7,marginBottom:10}}>{bio}</p>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {[

            {label:"Spotify",url:links.spotify,color:"#1DB954"},

          ))}

// ══ App ════════════════════════════════════════════════
function App(){

  const {rows,loading,error,lastUpdated,refetch}=useData();

  const fPress=pressItems.filter(p=>!search||(p.title+p.source).toLowerCase().includes(search.toLowerCase()));

  const igPending=!agg["IG 粉絲數"]||agg["IG 粉絲數"]===0;
  const spPending=!agg["Spotify 月聽眾量"]||agg["Spotify 月聽眾量"]===0;

  return(
    <div style={{minHeight:"100vh",paddingBottom:60}}>
      {/* ── Header ── */}

            <div style={{width:34,height:34,borderRadius:9,background:"linear-gradient(135deg,#7C3AED,#EC4899)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>🎵</div>

            </div>
          </div>
          <div style={{flex:1,minWidth:140}}>

              <span style={{fontSize:13,color:"#525252"}}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={t.search}
                style={{background:"none",border:"none",outline:"none",color:"#E5E5E5",fontSize:12,width:"100%"}}/>

              style={{background:"none",border:"1px solid #262626",borderRadius:8,padding:"6px 8px",color:"#525252",cursor:"pointer"}}>↻</button>
            <button onClick={()=>setLang(l=>l==="zh"?"en":"zh")}
              style={{display:"flex",alignItems:"center",gap:5,background:"#171717",border:"1px solid #262626",borderRadius:8,padding:"6px 13px",color:"#A3A3A3",fontSize:12,cursor:"pointer"}}>
              🌐 {t.switchLang}
            </button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1200,margin:"0 auto",padding:"24px 20px 0"}}>
        {loading?(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:300,gap:16}}>
            <div style={{width:36,height:36,border:"2px solid #262626",borderTop:"2px solid #7C3AED",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
            <span style={{color:"#525252",fontSize:13}}>{t.loading}</span>
          </div>
        ):error?(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:300,gap:14}}>
            <span style={{fontSize:28}}>⚠️</span>
            <span style={{color:"#737373",fontSize:13}}>{t.error}</span>
            <div style={{color:"#404040",fontSize:11,maxWidth:340,textAlign:"center",lineHeight:1.6}}>{error}</div>
            <button onClick={refetch} style={{background:"#7C3AED",color:"#fff",border:"none",borderRadius:8,padding:"8px 20px",fontSize:13,cursor:"pointer"}}>{t.retry}</button>
          </div>
        ):(
          <div className="fade-in">
            {/* 樂團簡介 */}
            <BandBio t={t}/>

            {/* KPIs */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12,marginBottom:20}}>
              <KpiCard icon="📷" accent="#E1306C" label={t.igFans} value={fmtNum(agg["IG 粉絲數"])} delta={agg["IG 月增減"]} pending={igPending} historyData={history} histField="ig" histLabel={t.igFans} t={t}/>
              <KpiCard icon="🎵" accent="#1DB954" label={t.spotifyListeners} value={fmtNum(agg["Spotify 月聽眾量"])} delta={agg["Spotify 月聽眾量增減"]} pending={spPending} historyData={history} histField="spotify" histLabel={t.spotifyListeners} t={t}/>
              <KpiCard icon="▶" accent="#FF0000" label={t.ytSubs} value={fmtNum(agg["YouTube 訂閱數"])} delta={agg["YouTube 月訂閱增減"]} historyData={history} histField="ytSubs" histLabel={t.ytSubs} t={t}/>
              <KpiCard icon="📊" accent="#F59E0B" label={t.ytTotal} value={fmtNum(agg["YouTube 總觀看量"])} historyData={history} histField="ytTotal" histLabel={t.ytTotal} t={t}/>
            </div>

            {/* Spotify panels */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:14,marginBottom:20}}>
              <div style={{background:"#171717",border:"1px solid #262626",borderRadius:14,padding:"1rem 1.2rem"}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:14}}>
                  <span style={{fontSize:14}}>🎵</span>
                  <span style={{fontWeight:700,fontSize:13}}>{t.topTracks}</span>
                </div>
                {top3.length===0
                  ?<div style={{color:"#525252",fontSize:13}}>{t.noData}</div>
                  :top3.map((tr,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<top3.length-1?"1px solid #1F1F1F":"none"}}>
                      <span style={{width:22,height:22,borderRadius:6,background:"#1DB95422",color:"#1DB954",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</span>
                      <span style={{fontSize:13,color:"#E5E5E5"}}>{tr}</span>
                    </div>
                  ))
                }
              </div>
              <div style={{background:"#171717",border:"1px solid #262626",borderRadius:14,padding:"1rem 1.2rem"}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:14}}>
                  <span style={{fontSize:14}}>📋</span>
                  <span style={{fontWeight:700,fontSize:13}}>{t.playlistLog}</span>
                </div>
                {playlists.length===0
                  ?<div style={{color:"#525252",fontSize:13}}>{t.noData}</div>
                  :playlists.map((line,i)=>(
                    <div key={i} style={{fontSize:12,color:"#A3A3A3",lineHeight:1.7,padding:"5px 0",borderBottom:i<playlists.length-1?"1px solid #1F1F1F":"none"}}>{line}</div>
                  ))
                }
              </div>
            </div>

            {/* Press + AI Campaigns */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:18}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:12}}>
                  <span style={{fontSize:14}}>📰</span>
                  <span style={{fontWeight:700,fontSize:13}}>{t.press}</span>
                  <span style={{fontSize:10,color:"#525252",background:"#1F1F1F",borderRadius:5,padding:"2px 7px"}}>{fPress.length}</span>
                </div>
                {fPress.length===0
                  ?<div style={{color:"#525252",fontSize:13,padding:"28px 0",textAlign:"center"}}>{t.noData}</div>
                  :fPress.map((item,i)=><PressCard key={i} item={item}/>)
                }
              </div>
              <AISuggestions agg={agg} lang={lang} t={t}/>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
